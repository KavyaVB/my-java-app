apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-java-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-java-app

  template:
    metadata:
      labels:
        app: my-java-app

    spec:
      containers:
        - name: my-java-app
          image: public.ecr.aws/YOUR_ALIAS/my-java-app:latest

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
